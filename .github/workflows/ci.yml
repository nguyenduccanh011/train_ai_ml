name: CI

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: stock_ml

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: ruff check
        run: ruff check src/ scripts/ tests/

      - name: ruff format check
        run: ruff format --check src/ scripts/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          # Skip heavy ML deps that don't affect type checking
          pip install lightgbm xgboost --no-deps || true

      # (src/components/ was removed in the DB-first migration — no longer type-checked.)
      - name: mypy src/pipeline/
        run: mypy src/pipeline/ --ignore-missing-imports

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (real tree)
        run: |
          # tests/ is the real suite (old path tests/components/ was removed in DB-first migration).
          # Only two exclusions remain — see ENGINE_UPGRADE §15:
          #   test_portfolio_engine.py -> tests engine #2 (§10.2; removed WITH the engine in Phase 6)
          #   test_run_experiment_e2e  -> needs committed data/bundle (integration, not unit)
          # (model_dashboard, dsl_ops/resolver FIXED; per_slot/loader dead tests DELETED — Phase-2 sweep.)
          pytest tests/ -q --tb=short \
            --ignore=tests/execution/test_portfolio_engine.py \
            --ignore=tests/test_run_experiment_e2e.py

  db-migrations:
    name: DB migrations (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockml
          POSTGRES_USER: stockml
          POSTGRES_PASSWORD: stockml_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockml -d stockml"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DB deps
        working-directory: .
        run: pip install -r requirements-api.txt

      # Validates every migration (0001→head) applies cleanly on a fresh Postgres,
      # catching dialect-portability regressions (e.g. non-idempotent DROP INDEX).
      - name: alembic upgrade head
        working-directory: .
        env:
          DATABASE_URL: postgresql://stockml:stockml_dev@localhost:5432/stockml
          PYTHONPATH: .
        run: alembic -c alembic.ini upgrade head

      - name: Schema/leaderboard tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest tests/leaderboard/test_schema.py -q --tb=short

  test-regression:
    name: Regression (hash check)
    runs-on: ubuntu-latest
    # Only run on push to master or refactor branches, not every PR
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache golden baseline
        uses: actions/cache@v4
        with:
          path: stock_ml/tests/regression/golden
          key: golden-${{ hashFiles('stock_ml/tests/regression/golden/checksums.txt') }}

      - name: Run snapshot/hash regression
        run: |
          # test_serving_golden.py (ENGINE_UPGRADE §11.5.3, Phase 2b) is the no-switch full-chain
          # "cái cân": the production serving path (load_bundle -> generate_signals_from_bundle) on a
          # committed self-contained bundle + OHLCV slice, asserting the discrete signal byte-for-byte.
          # The two *_snapshot tests remain as narrow engine-config/recombine hash guards.
          pytest tests/test_serving_golden.py tests/test_baseline_snapshot.py tests/test_recombine_snapshot.py -q --tb=short
