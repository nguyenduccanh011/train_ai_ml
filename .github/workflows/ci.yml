name: CI

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: stock_ml

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: ruff check
        run: ruff check src/ scripts/ tests/

      - name: ruff format check
        run: ruff format --check src/ scripts/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          # Skip heavy ML deps that don't affect type checking
          pip install lightgbm xgboost --no-deps || true

      - name: mypy src/components/
        run: mypy src/components/ --ignore-missing-imports

      - name: mypy src/pipeline/
        run: mypy src/pipeline/ --ignore-missing-imports

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (no regression, no integration)
        run: |
          pytest tests/components/ -q --tb=short \
            -k "not integration" \
            --ignore=tests/components/test_legacy_adapter.py

  db-migrations:
    name: DB migrations (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockml
          POSTGRES_USER: stockml
          POSTGRES_PASSWORD: stockml_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockml -d stockml"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DB deps
        working-directory: .
        run: pip install -r requirements-api.txt

      # Validates every migration (0001→head) applies cleanly on a fresh Postgres,
      # catching dialect-portability regressions (e.g. non-idempotent DROP INDEX).
      - name: alembic upgrade head
        working-directory: .
        env:
          DATABASE_URL: postgresql://stockml:stockml_dev@localhost:5432/stockml
          PYTHONPATH: .
        run: alembic -c alembic.ini upgrade head

      - name: Schema/leaderboard tests
        env:
          DATABASE_URL: sqlite:///:memory:
        run: pytest tests/leaderboard/test_schema.py -q --tb=short

  test-regression:
    name: Regression (hash check)
    runs-on: ubuntu-latest
    # Only run on push to master or refactor branches, not every PR
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache golden baseline
        uses: actions/cache@v4
        with:
          path: stock_ml/tests/regression/golden
          key: golden-${{ hashFiles('stock_ml/tests/regression/golden/checksums.txt') }}

      - name: Run champion hash regression
        run: |
          pytest tests/regression/test_champions.py -q --tb=short
