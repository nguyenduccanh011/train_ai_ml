[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_ml_core"
version = "0.4.2"
description = "Inference-only façade for stock_ml model bundles (production serving)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<2.2",
    "numpy>=1.26,<2",
    "lightgbm>=4,<5",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "scipy>=1.11",
    "pyarrow>=14",
    "pyyaml>=6",
]

# Package only the inference surface: stock_ml.core + the src.* subpackages it pulls
# + stock_ml.portfolio (Stage-2 overlay — serving imports it via this wheel; duckdb/
# sqlite are context-injected, NOT wheel deps). Excludes stock_ml.src.api (FastAPI);
# never includes stock_ml.db / tests / scripts / dashboard. Verified import-clean
# (no sqlalchemy/fastapi) by test_core_facade.py.
[tool.setuptools.packages.find]
namespaces = true
include = ["stock_ml.core*", "stock_ml.src*", "stock_ml.portfolio*"]
exclude = ["stock_ml.src.api*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "stock_ml/archive",
    "stock_ml/legacy",
    "stock_ml/results",
    "portable_data",
    # Root-level ad-hoc analysis scripts (sẽ move vào stock_ml/analysis/ khi cleanup)
    "analyze_v31_trades.py",
    "analyze_v32_trades.py",
    "preprocess_stocks.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length — tạm bỏ qua, sẽ siết sau
    "N803",   # argument name should be lowercase (X, X_train là convention ML)
    "N806",   # variable in function should be lowercase
    "B008",   # function call in default arg
    "SIM108", # ternary
]

[tool.ruff.lint.per-file-ignores]
"stock_ml/tests/**" = ["B011"]
# Legacy code: chỉ check critical errors, bỏ qua style warnings.
# Sẽ siết khi port qua src/components/ ở Phase 1+.
"stock_ml/src/**" = ["SIM", "B007", "B905", "F841", "N816", "E741", "E702", "W293", "N814"]
"stock_ml/experiments/**" = ["SIM", "B007", "B905", "F", "N", "E"]
"stock_ml/analysis/**" = ["SIM", "B007", "B905", "F", "N", "E"]
"stock_ml/run_pipeline.py" = ["SIM", "B007", "F841", "E741", "N814", "E402"]
"stock_ml/colab_setup.py" = ["F841"]
"stock_ml/compare_rule_vs_model.py" = ["B007"]
"stock_ml/model_manager.py" = ["B007"]
# Utility scripts: ignore E402 (imports after sys.path), B007 (unused loop vars), F841 (unused vars)
"stock_ml/scripts/**" = ["E402", "B007", "F841", "E722"]
"stock_ml/stock_ml/scripts/**" = ["E402", "B007", "F841", "E722"]
# train61_standalone: ignore style warnings for legacy backtest engine and feature code
"stock_ml/train61_standalone/app/**" = ["E402", "I"]
"stock_ml/train61_standalone/tools/**" = ["E402"]
"stock_ml/train61_standalone/src/backtest/**" = ["SIM", "E741", "F841"]
"stock_ml/train61_standalone/src/data/**" = ["SIM"]
"stock_ml/train61_standalone/src/features/**" = ["E741", "SIM", "F841"]
"stock_ml/train61_standalone/src/components/features/**" = ["E741", "SIM"]
"stock_ml/train61_standalone/src/components/fusion/**" = ["SIM"]
"stock_ml/train61_standalone/src/pipeline/**" = ["N814", "B905"]
"stock_ml/train61_standalone/src/strategies/**" = ["SIM", "F841"]
"stock_ml/train61_standalone/**" = ["B007"]

[tool.mypy]
python_version = "3.11"
strict = false
files = ["stock_ml/src/components"]
# stock_ml/src/pipeline sẽ thêm khi Phase 3 build orchestrator.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["stock_ml/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "regression: full regression test (slow, ~6 min for 11 champions)",
    "quick: fast smoke test using cached predictions",
]
