name: vn_stock
market_type: equity_spot

data:
  # OHLCV source-of-truth is the DuckDB OLAP store (read-only). Path is relative
  # to the stock_ml/ package and resolves to <repo>/market_data/market.duckdb.
  # Rollback: point back to "/portable_data/vn_stock_ai_dataset_cleaned" (CSV kept).
  data_dir: "../market_data/market.duckdb"
  schema: ohlcv_daily
  default_timeframe: "1D"
  benchmark_symbol: "HNXINDEX"
  timestamp_column: "timestamp"
  timezone: "Asia/Ho_Chi_Minh"
  required_columns: [open, high, low, close, volume]
  optional_columns: []
  volume_unit: shares

execution:
  instrument_type: spot
  pnl_mode: equity_spot
  commission: 0.0015
  tax: 0.001
  slippage: 0.0
  initial_capital: 100000000
  currency: VND
  contract_multiplier: 1
  funding_rate_column: null
  margin_mode: null
  leverage: 1
  maintenance_margin_rate: 0.0
  liquidation_fee: 0.0

# P5: the symbol universe is DB-managed (universe_sets). The market default set
# lives under slug "vn_stock_default" (seeded by migration 0021) and is resolved
# at runtime by get_pipeline_symbols — the market YAML no longer hardcodes a
# symbol list, groups, or per-strategy symbol overrides.

features:
  enabled_blocks: null

models:
  default_stack: null

target:
  type: trend_regime
  horizon: 8
  unit: bars
  forward_window: 8
